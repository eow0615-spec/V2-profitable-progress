<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Profitable Progress</title>
<style>
:root{--bg:#fff;--surface:#f5f5f2;--text:#0a0a0a;--muted:#6b6b6b;--gold:#c9a227;--line:#e3e3de;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--surface:#161616;--text:#fff;--muted:#9a9a9a;--gold:#d4af37;--line:#2a2a2a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0a;--surface:#161616;--text:#fff;--muted:#9a9a9a;--gold:#d4af37;--line:#2a2a2a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:560px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(40px + env(safe-area-inset-bottom,0px))}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0;letter-spacing:.5px}
h1 span{color:var(--gold)}
.theme{background:none;border:1px solid var(--line);color:var(--text);border-radius:20px;padding:6px 12px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .3s}
.muted{color:var(--muted);font-size:13px}
.days{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.day{flex:1;min-width:46px;padding:10px 0;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;position:relative}
.day.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.day.today::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--gold)}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{width:28px;height:28px;border-radius:8px;border:2px solid var(--gold);background:none;flex:none;color:#0a0a0a;font-size:18px;line-height:1}
.chk.on{background:var(--gold)}
.row .t{flex:1}
.row.done .t b{text-decoration:line-through;color:var(--muted)}
.t small{display:block;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:20px}
input[type=text],input[type=time]{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px}
.add{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.add input:first-child{grid-column:1/3}
.btn{padding:12px 14px;border-radius:10px;border:0;background:var(--gold);color:#0a0a0a;font-weight:700;font-size:15px;text-align:center}
.btn.ghost{background:none;border:1px solid var(--gold);color:var(--text)}
.rem{display:flex;gap:8px;align-items:center;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:18px 0}
h2{font-size:16px;margin:0 0 4px}
.title input{font-size:17px;font-weight:700}
.note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
</style>
</head>
<body>
<header>
  <h1>PROFITABLE <span>PROGRESS</span></h1>
  <button class="theme" id="theme" type="button">Theme</button>
</header>

<div class="card">
  <h2>This week</h2>
  <div class="bar"><i id="weekBar"></i></div>
  <div class="muted" id="weekTxt"></div>
</div>

<div class="days" id="days"></div>

<div class="card">
  <div class="title"><input type="text" id="dayName" placeholder="What are you training? (e.g. Push Day)" maxlength="40"></div>
  <div class="bar"><i id="dayBar"></i></div>
  <div class="muted" id="dayTxt"></div>
  <div id="list"></div>
  <div class="add">
    <input type="text" id="exName" placeholder="Add exercise (e.g. Bench Press)" maxlength="50">
    <input type="text" id="exSets" placeholder="Sets x reps (3x10)" maxlength="20">
    <button class="btn" id="addBtn" type="button">Add</button>
  </div>
</div>

<div class="card">
  <h2>Workout reminder</h2>
  <div class="muted">Pick the time you train on this day. You get a notification every week with the workout in it. Days with no exercises are rest days and stay quiet.</div>
  <div class="rem"><input type="time" id="time" value="17:00"></div>
  <div class="two">
    <button class="btn" id="enableBtn" type="button">Enable notifications</button>
    <button class="btn ghost" id="testBtn" type="button">Send test</button>
  </div>
  <div class="note" id="status"></div>
</div>

<script>
var NAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var FULL=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
var state={plan:{},done:{},times:{}};
try{var s=localStorage.getItem("pp_state");if(s)state=JSON.parse(s)}catch(e){}
state.plan=state.plan||{};state.done=state.done||{};state.times=state.times||{};
function save(){try{localStorage.setItem("pp_state",JSON.stringify(state))}catch(e){}}
function $(id){return document.getElementById(id)}
function pad(n){return n<10?"0"+n:""+n}
function todayIdx(){return (new Date().getDay()+6)%7}
var sel=todayIdx();
function dateFor(i){var d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+(i-todayIdx()));return d}
function key(i){var d=dateFor(i);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function dayData(i){if(!state.plan[i])state.plan[i]={name:"",ex:[]};return state.plan[i]}
function doneSet(i){var k=key(i);if(!state.done[k])state.done[k]={};return state.done[k]}
function stats(i){var d=dayData(i),ds=doneSet(i),n=d.ex.length,c=0;d.ex.forEach(function(e){if(ds[e.id])c++});return{n:n,c:c}}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var dh="";
  NAMES.forEach(function(n,i){dh+='<button class="day'+(i===sel?' sel':'')+(i===todayIdx()?' today':'')+'" data-i="'+i+'" type="button">'+n+'</button>'});
  $("days").innerHTML=dh;
  var d=dayData(sel),ds=doneSet(sel);
  $("dayName").value=d.name;
  var lh="";
  d.ex.forEach(function(e){
    var on=!!ds[e.id];
    lh+='<div class="row'+(on?' done':'')+'"><button class="chk'+(on?' on':'')+'" data-c="'+e.id+'" type="button">'+(on?'&#10003;':'')+'</button><div class="t"><b>'+esc(e.name)+'</b>'+(e.sets?'<small>'+esc(e.sets)+'</small>':'')+'</div><button class="x" data-x="'+e.id+'" type="button" aria-label="Remove">&times;</button></div>';
  });
  $("list").innerHTML=lh||'<div class="empty">Rest day. Add exercises to plan a workout.</div>';
  var st=stats(sel);
  $("dayBar").style.width=(st.n?st.c/st.n*100:0)+"%";
  $("dayTxt").textContent=FULL[sel]+": "+st.c+" of "+st.n+" done"+(st.n&&st.c===st.n?" \u2014 workout complete!":"");
  var tn=0,tc=0;for(var i=0;i<7;i++){var s2=stats(i);tn+=s2.n;tc+=s2.c}
  $("weekBar").style.width=(tn?tc/tn*100:0)+"%";
  $("weekTxt").textContent=tc+" of "+tn+" exercises done this week";
  $("time").value=state.times[sel]||"17:00";
}

/* ---------- Native notifications (Capacitor Local Notifications) ---------- */
var LN=null;
try{if(window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications)LN=Capacitor.Plugins.LocalNotifications}catch(e){}
function setStatus(t){$("status").textContent=t}
var tmr;
function queue(){clearTimeout(tmr);tmr=setTimeout(scheduleAll,600)}
async function scheduleAll(){
  if(!LN)return;
  try{
    var p=await LN.checkPermissions();
    if(p.display!=="granted"){setStatus("Notifications are off. Tap Enable notifications.");return}
    var pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length){
      await LN.cancel({notifications:pend.notifications.filter(function(n){return n.id<100}).map(function(n){return{id:n.id}})});
    }
    var list=[],names=[];
    for(var i=0;i<7;i++){
      var d=dayData(i);if(!d.ex.length)continue;
      var t=(state.times[i]||"17:00").split(":");
      list.push({
        id:i+1,
        title:"Time to train: "+(d.name||FULL[i]),
        body:d.ex.map(function(e){return e.name+(e.sets?" ("+e.sets+")":"")}).join(", "),
        schedule:{on:{weekday:((i+1)%7)+1,hour:+t[0],minute:+t[1]},allowWhileIdle:true}
      });
      names.push(NAMES[i]);
    }
    if(list.length)await LN.schedule({notifications:list});
    setStatus(list.length?"Reminders set for: "+names.join(", ")+".":"No workouts planned yet, so no reminders are set.");
  }catch(e){setStatus("Couldn't set reminders. Try Enable notifications again.")}
}
$("enableBtn").addEventListener("click",async function(){
  if(!LN){setStatus("Notifications only work in the installed Android app.");return}
  try{await LN.requestPermissions()}catch(e){}
  scheduleAll();
});
$("testBtn").addEventListener("click",async function(){
  if(!LN){setStatus("Notifications only work in the installed Android app.");return}
  try{
    var p=await LN.checkPermissions();
    if(p.display!=="granted"){p=await LN.requestPermissions()}
    if(p.display!=="granted"){setStatus("Notifications are blocked. Allow them in Android Settings > Apps > Profitable Progress.");return}
    await LN.schedule({notifications:[{id:100,title:"Profitable Progress",body:"Test notification. Your reminders are working.",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true}}]});
    setStatus("Test sent. Close the app and wait about 5 seconds.");
  }catch(e){setStatus("Test failed.")}
});

/* ---------- UI events ---------- */
$("days").addEventListener("click",function(e){var b=e.target.closest("[data-i]");if(b){sel=+b.dataset.i;render()}});
$("list").addEventListener("click",function(e){
  var c=e.target.closest("[data-c]"),x=e.target.closest("[data-x]");
  if(c){var ds=doneSet(sel),id=c.dataset.c;if(ds[id])delete ds[id];else ds[id]=1;save();render()}
  if(x){var d=dayData(sel);d.ex=d.ex.filter(function(q){return String(q.id)!==x.dataset.x});save();render();queue()}
});
$("addBtn").addEventListener("click",function(){
  var n=$("exName").value.trim();if(!n)return;
  dayData(sel).ex.push({id:Date.now(),name:n,sets:$("exSets").value.trim()});
  $("exName").value="";$("exSets").value="";save();render();queue();
});
$("exName").addEventListener("keydown",function(e){if(e.key==="Enter")$("addBtn").click()});
$("dayName").addEventListener("input",function(){dayData(sel).name=this.value;save();queue()});
$("time").addEventListener("change",function(){state.times[sel]=this.value;save();queue()});

var theme="auto";
try{theme=localStorage.getItem("pp_theme")||"auto"}catch(e){}
function applyTheme(){if(theme==="auto")document.documentElement.removeAttribute("data-theme");else document.documentElement.setAttribute("data-theme",theme)}
$("theme").addEventListener("click",function(){theme=theme==="auto"?"dark":theme==="dark"?"light":"auto";try{localStorage.setItem("pp_theme",theme)}catch(e){}applyTheme();this.textContent="Theme: "+theme});
applyTheme();
render();

if(LN){
  (async function(){
    try{var p=await LN.checkPermissions();if(p.display!=="granted")await LN.requestPermissions()}catch(e){}
    scheduleAll();
  })();
}else{
  setStatus("You're viewing this in a browser. Install the Android app to get workout notifications.");
}
</script>
</body>
</html>
